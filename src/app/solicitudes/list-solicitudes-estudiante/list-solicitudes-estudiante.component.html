<mat-card>
  <div class="col-12" *ngIf="showTable">
    <mat-card-header>
      <legend>
        &nbsp;{{ "MENU.gestionar_solicitudes.solicitudes_actualizacion" | translate }}
      </legend>
    </mat-card-header>
    <mat-card-content>
      <table mat-table [dataSource]="dataSource" matSort>
        <ng-container *ngFor="let columna of displayedColumns" [matColumnDef]="columna">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>{{ nombresColumnas[columna] | translate }}</th>
          <td mat-cell *matCellDef="let fila; let i = index"
              [ngClass]="{'row-par': i % 2 === 0, 'row-impar': i % 2 !== 0, 'row-hover': hoverIndex === i}"
              (mouseover)="hoverIndex = i"
              (mouseout)="hoverIndex = null">

              <ng-container *ngIf="columna != 'Acciones'">
                  {{ fila[columna] }}
              </ng-container>

              <ng-container *ngIf="columna == 'Acciones'">
                  <button mat-icon-button [matTooltip]=fila[columna]?.label (click)="onclick(fila)">
                      <mat-icon [class]=fila[columna]?.class>{{ fila[columna]?.icon }}</mat-icon>
                  </button>
              </ng-container>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let fila; columns: displayedColumns;"></tr>
      </table>

      <mat-paginator
          [pageSize]="10"
          [pageSizeOptions]="[]"
          showFirstLastButtons></mat-paginator>
    </mat-card-content>
  </div>

  <mat-card-content *ngIf="showSolicitudID">
    <ngx-actualizacion-datos></ngx-actualizacion-datos>
    <button (click)="activateTab()" class="btn btn-info btn-sm">
      <i class="nb-arrow-dropleft"></i> {{ "GLOBAL.regresar" | translate }}
    </button>
  </mat-card-content>

  <mat-card-content *ngIf="showSolicitudNombre">
    <actualizacion-nombres></actualizacion-nombres>
    <button (click)="activateTab()" class="btn btn-info btn-sm">
      <i class="nb-arrow-dropleft"></i> {{ "GLOBAL.regresar" | translate }}
    </button>
  </mat-card-content>
</mat-card>
